name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Змінні середовища для збірки. Перевизначте їх через Secrets/Variables репозиторія
  # (Settings → Secrets and variables → Actions), якщо потрібні інші значення.
  VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE || 'portal' }}
  VITE_PORTAL_URL: ${{ vars.VITE_PORTAL_URL || 'https://gis.htgoims.org/portal' }}
  VITE_OAUTH_CLIENT_ID: ${{ vars.VITE_OAUTH_CLIENT_ID || 'UkLjSBHNNooE1jnb' }}
  VITE_OAUTH_REDIRECT_URI: ${{ vars.VITE_OAUTH_REDIRECT_URI || 'https://haloukrainegis.github.io/CASEVAC_editor/' }}
  VITE_WEBMAP_ID: ${{ vars.VITE_WEBMAP_ID || 'f5c528f766ec467c9d7388787bc58698' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
